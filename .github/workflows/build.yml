name: Build Android

# فقط نسخهٔ اندروید (پروژهٔ جدا از ویندوز). اجرا: Actions → Build Android → Run workflow

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-*'

# Signing key priority (the APK can only UPDATE an installed app if signed with the SAME key as before):
#  1) Repo secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#  2) File ci/debug.keystore in the repo (password/alias from secrets, else "android" / "androiddebugkey")
#  3) Neither: Flutter's random debug key (installs fresh only; cannot update an app signed with another key)

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check required Android icon files
        shell: bash
        run: |
          missing=0
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher.png ic_launcher_foreground.png; do
              if [ ! -f "android/app/src/main/res/mipmap-$d/$f" ]; then echo "MISSING: mipmap-$d/$f"; missing=1; fi
            done
          done
          if [ "$missing" = "1" ]; then
            echo "::error::Android icon PNGs are missing (they are not in the Z-Limit zip). Copy them from your original repo into app/android/app/src/main/res/ and push."
            exit 1
          fi

      - name: Prepare signing
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ks"
          KS_FILE=""
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks/release.jks"; KS_FILE="$RUNNER_TEMP/ks/release.jks"
            echo "Using keystore from secrets"
          elif [ -f ci/debug.keystore ]; then
            KS_FILE="$GITHUB_WORKSPACE/ci/debug.keystore"
            echo "Using ci/debug.keystore"
          else
            echo "::warning::No keystore found: APK is signed with a random debug key and cannot update an already-installed app."
          fi
          if [ -n "$KS_FILE" ]; then
            {
              echo "storeFile=$KS_FILE"
              echo "storePassword=${KS_PASS:-android}"
              echo "keyAlias=${KS_ALIAS:-androiddebugkey}"
              echo "keyPassword=${KS_KEY_PASS:-${KS_PASS:-android}}"
            } > android/key.properties
          fi

      - name: Wire signing into Gradle (only when key.properties exists)
        shell: python
        run: |
          import os
          if not os.path.exists('android/key.properties'):
              print('no key.properties - leaving default signing')
              raise SystemExit(0)
          p = 'android/app/build.gradle.kts'
          s = open(p, encoding='utf-8').read()
          header = 'import java.util.Properties\nimport java.io.FileInputStream\n\n'
          lines = [
              '    signingConfigs {',
              '        create("pb") {',
              '            val kp = Properties()',
              '            kp.load(FileInputStream(rootProject.file("key.properties")))',
              '            storeFile = file(kp.getProperty("storeFile"))',
              '            storePassword = kp.getProperty("storePassword")',
              '            keyAlias = kp.getProperty("keyAlias")',
              '            keyPassword = kp.getProperty("keyPassword")',
              '        }',
              '    }',
              '',
              '    buildTypes {',
          ]
          block = '\n'.join(lines)
          assert '    buildTypes {' in s and 'signingConfigs.getByName("debug")' in s, 'build.gradle.kts changed shape'
          s = s.replace('    buildTypes {', block, 1)
          s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("pb")', 1)
          open(p, 'w', encoding='utf-8').write(header + s)

      - run: flutter pub get

      - name: Analyze (informational)
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/debug-symbols

      - name: Show signing certificate (compare with your installed app)
        shell: bash
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "SHA-256|Signer #1 certificate DN" || true
          mkdir -p dist
          cp "$APK" dist/pesteh-bazar.apk
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: pesteh-android
          path: dist/pesteh-bazar.apk
          retention-days: 7
