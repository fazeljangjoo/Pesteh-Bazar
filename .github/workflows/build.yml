name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android files
        run: flutter create --platforms=android --project-name pesteh_bazar .

      - name: Add notification permissions
        run: |
          python3 - <<'PYEOF'
          path = "android/app/src/main/AndroidManifest.xml"

          with open(path, encoding="utf-8") as f:
              content = f.read()

          perms = (
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n'
              '    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n'
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n'
          )

          if "android.permission.POST_NOTIFICATIONS" not in content:
              content = content.replace(
                  '<application',
                  perms + '    <application',
                  1
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release -v 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pesteh-apk
          path: build/app/outputs/flutter-apk/app-release.apk
